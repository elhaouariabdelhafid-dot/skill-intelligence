version: "3.9"

# AI Skill Intelligence Platform — infrastructure de développement
# Usage :  docker compose up -d
# Dashboard Qdrant : http://localhost:6333/dashboard
# Neo4j Browser    : http://localhost:7474
# Langfuse         : http://localhost:3000

services:

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ski-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ski-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skill}
      POSTGRES_DB: ${POSTGRES_DB:-skilldb}
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/pg:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skill}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Base dédiée à Langfuse (évite les collisions de migrations avec skilldb)
  postgres-langfuse:
    image: postgres:16-alpine
    container_name: ski-pg-langfuse
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - ./volumes/pg-langfuse:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: ski-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs

  ollama:
    image: ollama/ollama:latest
    container_name: ski-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    # Décommenter si GPU NVIDIA disponible sous WSL2 :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  langfuse:
    image: langfuse/langfuse:2
    container_name: ski-langfuse
    restart: unless-stopped
    depends_on:
      postgres-langfuse:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres-langfuse:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-changeme-secret}
      SALT: ${LANGFUSE_SALT:-changeme-salt}
      TELEMETRY_ENABLED: "false"
